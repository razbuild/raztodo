<svg width="1058" height="1058" viewBox="0 0 1058 1058" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Red palette -->
    <linearGradient id="tint" x1="300" y1="250" x2="760" y2="760">
        <stop offset="0%" stop-color="#FF4D4D"/>
        <stop offset="45%" stop-color="#D10000"/>
        <stop offset="100%" stop-color="#AB0000"/>
    </linearGradient>

    <!-- Subtle texture -->
    <pattern id="noise" width="90" height="90" patternUnits="userSpaceOnUse">
        <circle cx="15" cy="15" r="1" fill="#FFFFFF" opacity=".025"/>
    </pattern>

    <clipPath id="clip">
        <rect x="17" y="17" width="1024" height="1024" rx="225"/>
    </clipPath>

    <!-- Soft glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="18"/>
    </filter>

</defs>

<!-- Background -->
<rect
    x="17"
    y="17"
    width="1024"
    height="1024"
    rx="225"
    fill="#140404"/>

<!-- Subtle grain -->
<rect
    x="17"
    y="17"
    width="1024"
    height="1024"
    rx="225"
    fill="url(#noise)"
    clip-path="url(#clip)"/>

<!-- Glow layer -->
<path
    d="M790 790V268H268"
    fill="none"
    stroke="url(#tint)"
    stroke-width="90"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".25"
    filter="url(#glow)"/>

<!-- Outer -->
<path
    d="M790 790V268H268"
    fill="none"
    stroke="url(#tint)"
    stroke-width="82"
    stroke-linecap="round"
    stroke-linejoin="round"/>

<!-- Inner -->
<path
    d="M610 620V450H450"
    fill="none"
    stroke="url(#tint)"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</svg>