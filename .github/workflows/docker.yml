name: Docker Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image
        run: |
          docker build \
            --build-arg USER_UID=$(id -u) \
            --build-arg USER_GID=$(id -g) \
            -t raztodo:test .

      - name: Test Docker CLI
        run: |
          docker run --rm raztodo:test --help
          docker run --rm raztodo:test --version

      - name: Test Docker persistence
        run: |
          set -e

          volume=raztodo-ci-data

          docker volume rm "$volume" 2>/dev/null || true
          trap 'docker volume rm "$volume" 2>/dev/null || true' EXIT

          docker run --rm \
            -v "$volume:/data" \
            raztodo:test \
            add "CI test task"

          docker run --rm \
            -v "$volume:/data" \
            raztodo:test \
            list | grep -F "CI test task"

      - name: Test non-root user
        run: |
          test "$(docker run --rm \
            --entrypoint id \
            raztodo:test \
            -un)" = "raztodo"
            
      - name: Test Docker data permissions
        run: |
          docker volume rm raztodo-ci-permissions 2>/dev/null || true
          trap 'docker volume rm raztodo-ci-permissions 2>/dev/null || true' EXIT

          docker run --rm \
            -v raztodo-ci-permissions:/data \
            --entrypoint sh \
            raztodo:test \
            -c 'touch /data/permission-test && test -f /data/permission-test'

      - name: Test Docker wrapper lifecycle
        run: |
          bash docker/test_wrapper.sh